name: validate

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
    branches: [ dev, main ]
  push:
    branches: [ dev, main ]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="${{ github.sha }}~1..${{ github.sha }}"
          fi
          gitleaks git . --config .gitleaks.toml --log-opts="$RANGE" --redact --no-banner --exit-code 1

      - name: Check the page's own files
        run: |
          set -euo pipefail
          test -f index.html
          test -d assets
          missing=""
          for ref in $(grep -oE '(src|href|poster)="assets/[^"#?]+' index.html | sed -E 's/^[a-z]+="//' | sort -u); do
            [ -f "$ref" ] || missing="$missing $ref"
          done
          if [ -n "$missing" ]; then
            echo "::error::index.html references files that are not in the repository:$missing"
            exit 1
          fi
          echo "Every file index.html references is present."

      - name: Build the image
        run: docker build --platform linux/amd64 -t pr-scan:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          set -euo pipefail
          docker run -d --name landing -p 8080:8080 pr-scan:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<title'
          headers="$(curl -fsSI http://127.0.0.1:8080/)"
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^x-frame-options: sameorigin'
          echo "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'
          status="$(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-1023' http://127.0.0.1:8080/assets/metawurks-usecases.mp4)"
          if [ "$status" != "206" ]; then
            echo "::error::The video answered a range request with $status instead of 206, so its chapter buttons cannot seek."
            exit 1
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-page)"
          if [ "$status" != "404" ]; then
            echo "::error::A missing page answered $status instead of 404."
            exit 1
          fi
          echo "The container serves the page, its security headers, video ranges and 404s."

      - name: Container logs
        if: failure()
        run: docker logs landing || true

      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pr-scan:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: .trivyignore
          format: table

      - name: Lint workflows (actionlint)
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -color -shellcheck= -pyflakes=
